# Fail-closed overnight Polymarket research on GitHub-hosted runners.
# Research validity is separate from GitHub job green checks.
name: Overnight Polymarket Research

concurrency:
  group: overnight-polymarket-research
  cancel-in-progress: false

permissions:
  contents: read

"on":
  workflow_dispatch:
    inputs:
      run_backfill:
        description: Run year backfills
        type: boolean
        default: true
      run_outcome_sweep:
        description: Run outcome sweep if quality gate passes
        type: boolean
        default: true
      run_l2_collection:
        description: Run prospective L2 collection
        type: boolean
        default: true
      l2_duration_seconds:
        description: L2 collection duration (seconds)
        type: string
        default: "18000"
      l2_token_limit:
        description: Max active tokens to subscribe
        type: string
        default: "100"
      artifact_retention_days:
        description: Artifact retention days
        type: string
        default: "14"
      backfill_max_markets:
        description: Max markets per year
        type: string
        default: "400"
      train_end:
        description: Locked-test start (exclusive train end)
        type: string
        default: "2025-01-01T00:00:00+00:00"
      smoke_mode:
        description: Tiny smoke bounds for repair validation
        type: boolean
        default: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      retention: ${{ steps.env.outputs.retention }}
      train_end: ${{ steps.env.outputs.train_end }}
      smoke: ${{ steps.env.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
      - name: Record environment
        id: env
        run: |
          set -euo pipefail
          mkdir -p artifacts/preflight
          RETENTION="${{ github.event.inputs.artifact_retention_days }}"
          echo "retention=${RETENTION}" >> "$GITHUB_OUTPUT"
          echo "train_end=${{ github.event.inputs.train_end }}" >> "$GITHUB_OUTPUT"
          echo "smoke=${{ github.event.inputs.smoke_mode }}" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import hashlib, json, pathlib, platform, subprocess, sys
          from datetime import datetime, timezone
          req = pathlib.Path("requirements.txt").read_bytes()
          man = {
            "git_sha": subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip(),
            "python": sys.version.split()[0],
            "platform": platform.platform(),
            "requirements_sha256": hashlib.sha256(req).hexdigest(),
            "generated_at": datetime.now(timezone.utc).isoformat(),
            "inputs": {
              "run_backfill": "${{ github.event.inputs.run_backfill }}",
              "run_outcome_sweep": "${{ github.event.inputs.run_outcome_sweep }}",
              "run_l2_collection": "${{ github.event.inputs.run_l2_collection }}",
              "l2_duration_seconds": "${{ github.event.inputs.l2_duration_seconds }}",
              "l2_token_limit": "${{ github.event.inputs.l2_token_limit }}",
              "backfill_max_markets": "${{ github.event.inputs.backfill_max_markets }}",
              "train_end": "${{ github.event.inputs.train_end }}",
              "smoke_mode": "${{ github.event.inputs.smoke_mode }}",
            },
          }
          pathlib.Path("artifacts/preflight/manifest.json").write_text(json.dumps(man, indent=2))
          print(json.dumps(man, indent=2))
          PY
      - name: Full test suite
        run: python3 -m pytest tests/ -q --tb=line
      - name: Validate CLI imports
        run: |
          set -euo pipefail
          python3 -c "from polymarket_analytics.research import overnight_backfill, overnight_merge, overnight_gate, overnight_report"
          python3 -m polymarket_analytics --help >/dev/null
      - name: Guard tracked smoke books and user journal
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch data/books/collector_health.json >/dev/null 2>&1; then
            echo "Tracked runtime book health is forbidden" >&2
            exit 1
          fi
          if git ls-files --error-unmatch data/swing_trades.json >/dev/null 2>&1; then
            echo "User journal must remain untracked" >&2
            exit 1
          fi
      - name: Upload preflight artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overnight-preflight
          path: artifacts/preflight/
          retention-days: ${{ steps.env.outputs.retention }}

  backfill-2024:
    name: Backfill 2024
    needs: preflight
    if: needs.preflight.result == 'success' && github.event.inputs.run_backfill == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      - name: Backfill year 2024
        run: |
          set -euo pipefail
          MAX="${{ github.event.inputs.backfill_max_markets }}"
          SMOKE="${{ github.event.inputs.smoke_mode }}"
          ARGS=(--year 2024 --out-dir data/backfill/2024 --trade-limit-per-market 400)
          if [ "$SMOKE" = "true" ]; then ARGS+=(--tiny); elif [ -n "$MAX" ]; then ARGS+=(--max-markets "$MAX"); fi
          python3 -m polymarket_analytics backfill-year "${ARGS[@]}" 2>&1 | tee data/backfill/2024/job.log
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          q = json.loads(Path("data/backfill/2024/reports/year_quality.json").read_text())
          print(json.dumps(q, indent=2))
          if q.get("status") == "failed" or int(q.get("n_trades") or 0) <= 0:
              sys.exit(1)
          # in-year timestamp integrity
          import polars as pl
          t = pl.read_parquet("data/backfill/2024/curated/trades.parquet")
          years = set(t["traded_at"].dt.year().to_list())
          if years - {2024}:
              raise SystemExit(f"off-year trades present: {years}")
          PY
      - name: Package year artifact
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          src = Path("data/backfill/2024")
          out = Path("dist/polymarket-backfill-2024.tar.gz")
          with tarfile.open(out, "w:gz") as tar:
              if src.exists():
                  tar.add(src, arcname="2024")
          h = hashlib.sha256(out.read_bytes()).hexdigest()
          Path("dist/polymarket-backfill-2024.sha256").write_text(f"{h}  {out.name}\n")
          Path("dist/manifest.json").write_text(json.dumps({"year": 2024, "archive": out.name, "sha256": h}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polymarket-backfill-2024
          path: dist/
          retention-days: ${{ needs.preflight.outputs.retention }}

  backfill-2025:
    name: Backfill 2025
    needs: preflight
    if: needs.preflight.result == 'success' && github.event.inputs.run_backfill == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      - name: Backfill year 2025
        run: |
          set -euo pipefail
          MAX="${{ github.event.inputs.backfill_max_markets }}"
          SMOKE="${{ github.event.inputs.smoke_mode }}"
          ARGS=(--year 2025 --out-dir data/backfill/2025 --trade-limit-per-market 400)
          if [ "$SMOKE" = "true" ]; then ARGS+=(--tiny); elif [ -n "$MAX" ]; then ARGS+=(--max-markets "$MAX"); fi
          python3 -m polymarket_analytics backfill-year "${ARGS[@]}" 2>&1 | tee data/backfill/2025/job.log
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          import polars as pl
          q = json.loads(Path("data/backfill/2025/reports/year_quality.json").read_text())
          print(json.dumps(q, indent=2))
          if q.get("status") == "failed" or int(q.get("n_trades") or 0) <= 0:
              sys.exit(1)
          t = pl.read_parquet("data/backfill/2025/curated/trades.parquet")
          years = set(t["traded_at"].dt.year().to_list())
          if years - {2025}:
              raise SystemExit(f"off-year trades present: {years}")
          PY
      - name: Package year artifact
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          src = Path("data/backfill/2025")
          out = Path("dist/polymarket-backfill-2025.tar.gz")
          with tarfile.open(out, "w:gz") as tar:
              if src.exists():
                  tar.add(src, arcname="2025")
          h = hashlib.sha256(out.read_bytes()).hexdigest()
          Path("dist/polymarket-backfill-2025.sha256").write_text(f"{h}  {out.name}\n")
          Path("dist/manifest.json").write_text(json.dumps({"year": 2025, "archive": out.name, "sha256": h}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polymarket-backfill-2025
          path: dist/
          retention-days: ${{ needs.preflight.outputs.retention }}

  backfill-2026:
    name: Backfill 2026
    needs: preflight
    if: needs.preflight.result == 'success' && github.event.inputs.run_backfill == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      - name: Backfill year 2026
        run: |
          set -euo pipefail
          MAX="${{ github.event.inputs.backfill_max_markets }}"
          SMOKE="${{ github.event.inputs.smoke_mode }}"
          ARGS=(--year 2026 --out-dir data/backfill/2026 --trade-limit-per-market 400)
          if [ "$SMOKE" = "true" ]; then ARGS+=(--tiny); elif [ -n "$MAX" ]; then ARGS+=(--max-markets "$MAX"); fi
          python3 -m polymarket_analytics backfill-year "${ARGS[@]}" 2>&1 | tee data/backfill/2026/job.log
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          import polars as pl
          q = json.loads(Path("data/backfill/2026/reports/year_quality.json").read_text())
          print(json.dumps(q, indent=2))
          if q.get("status") == "failed" or int(q.get("n_trades") or 0) <= 0:
              sys.exit(1)
          t = pl.read_parquet("data/backfill/2026/curated/trades.parquet")
          years = set(t["traded_at"].dt.year().to_list())
          if years - {2026}:
              raise SystemExit(f"off-year trades present: {years}")
          PY
      - name: Package year artifact
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          src = Path("data/backfill/2026")
          out = Path("dist/polymarket-backfill-2026.tar.gz")
          with tarfile.open(out, "w:gz") as tar:
              if src.exists():
                  tar.add(src, arcname="2026")
          h = hashlib.sha256(out.read_bytes()).hexdigest()
          Path("dist/polymarket-backfill-2026.sha256").write_text(f"{h}  {out.name}\n")
          Path("dist/manifest.json").write_text(json.dumps({"year": 2026, "archive": out.name, "sha256": h}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polymarket-backfill-2026
          path: dist/
          retention-days: ${{ needs.preflight.outputs.retention }}

  l2-collect:
    name: Prospective L2 collection
    needs: preflight
    if: needs.preflight.result == 'success' && github.event.inputs.run_l2_collection == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      - name: Collect L2 books
        run: |
          set -euo pipefail
          DUR="${{ github.event.inputs.l2_duration_seconds }}"
          N="${{ github.event.inputs.l2_token_limit }}"
          SMOKE="${{ github.event.inputs.smoke_mode }}"
          if [ "$SMOKE" = "true" ]; then DUR=45; N=5; fi
          if [ "$DUR" -gt 18000 ]; then DUR=18000; fi
          mkdir -p data/books/runs
          # Ensure no tracked smoke contaminates packaging
          rm -rf data/books/raw data/books/normalized data/books/collector_health.json
          python3 -m polymarket_analytics collect-books \
            --duration "$DUR" \
            --n-tokens "$N" \
            --data-root data \
            2>&1 | tee data/books/collector_job.log
      - name: Package L2 artifact
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          runs = Path("data/books/runs")
          out = Path("dist/polymarket-l2-overnight.tar.gz")
          with tarfile.open(out, "w:gz") as tar:
              if runs.exists():
                  tar.add(runs, arcname="books/runs")
              log = Path("data/books/collector_job.log")
              if log.exists():
                  tar.add(log, arcname="books/collector_job.log")
          h = hashlib.sha256(out.read_bytes()).hexdigest()
          health = {}
          for hp in Path("data/books/runs").glob("*/collector_health.json"):
              health = json.loads(hp.read_text())
              break
          Path("dist/polymarket-l2-overnight.sha256").write_text(f"{h}  {out.name}\n")
          Path("dist/l2_manifest.json").write_text(json.dumps({"archive": out.name, "sha256": h, "health": health}, indent=2, default=str))
          if not health.get("ok", False):
              raise SystemExit(f"L2 health not ok: {health.get('error')}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polymarket-l2-overnight
          path: dist/
          retention-days: ${{ needs.preflight.outputs.retention }}

  merge-curate:
    name: Merge and curate expanded lake
    needs: [preflight, backfill-2024, backfill-2025, backfill-2026]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.backfill-2024.result == 'success' &&
      needs.backfill-2025.result == 'success' &&
      needs.backfill-2026.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      features_path: ${{ steps.merge.outputs.features_path }}
      baseline_rows: ${{ steps.merge.outputs.baseline_rows }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: polymarket-backfill-2024
          path: incoming/2024
      - uses: actions/download-artifact@v4
        with:
          name: polymarket-backfill-2025
          path: incoming/2025
      - uses: actions/download-artifact@v4
        with:
          name: polymarket-backfill-2026
          path: incoming/2026
      - name: Extract and merge
        id: merge
        run: |
          set -euo pipefail
          mkdir -p data/backfill data/canonical_expanded
          tar -xzf incoming/2024/polymarket-backfill-2024.tar.gz -C data/backfill
          tar -xzf incoming/2025/polymarket-backfill-2025.tar.gz -C data/backfill
          tar -xzf incoming/2026/polymarket-backfill-2026.tar.gz -C data/backfill
          BASELINE_ROWS=$(python3 -c "import polars as pl; from pathlib import Path; p=Path('data/curated/trade_features_canonical.parquet'); print(pl.read_parquet(p).height if p.exists() else 0)")
          echo "baseline_rows=${BASELINE_ROWS}" >> "$GITHUB_OUTPUT"
          python3 -m polymarket_analytics merge-expanded \
            --data-root data \
            --year-dir data/backfill/2024 \
            --year-dir data/backfill/2025 \
            --year-dir data/backfill/2026 \
            --existing-canonical data/curated/trades_canonical.parquet \
            --out-dir data/canonical_expanded \
            2>&1 | tee data/canonical_expanded/merge.log
          FEAT=data/canonical_expanded/trade_features_canonical_expanded.parquet
          test -f "$FEAT"
          echo "features_path=${FEAT}" >> "$GITHUB_OUTPUT"
          python3 - <<PY
          import json
          from pathlib import Path
          cov = json.loads(Path("data/canonical_expanded/coverage_report.json").read_text())
          print(json.dumps(cov, indent=2))
          if int(cov.get("features", {}).get("rows") or 0) <= 0:
              raise SystemExit("zero feature rows")
          if int(cov.get("features", {}).get("rows_added") or 0) <= 0:
              raise SystemExit("no new feature rows vs baseline")
          PY
      - name: Package canonical
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          src = Path("data/canonical_expanded")
          out = Path("dist/polymarket-canonical-expanded.tar.gz")
          with tarfile.open(out, "w:gz") as tar:
              tar.add(src, arcname="canonical_expanded")
          h = hashlib.sha256(out.read_bytes()).hexdigest()
          Path("dist/polymarket-canonical-expanded.sha256").write_text(f"{h}  {out.name}\n")
          Path("dist/manifest.json").write_text(json.dumps({"archive": out.name, "sha256": h, "features_path": "canonical_expanded/trade_features_canonical_expanded.parquet"}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polymarket-canonical-expanded
          path: dist/
          retention-days: ${{ needs.preflight.outputs.retention }}

  quality-gate:
    name: Expanded outcome quality gate
    needs: [preflight, merge-curate]
    if: always() && needs.preflight.result == 'success' && needs.merge-curate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: polymarket-canonical-expanded
          path: incoming
      - name: Evaluate gate
        id: gate
        run: |
          set -euo pipefail
          mkdir -p data artifacts/gate
          tar -xzf incoming/polymarket-canonical-expanded.tar.gz -C data
          FEAT=data/canonical_expanded/trade_features_canonical_expanded.parquet
          test -f "$FEAT"
          BASELINE_ROWS="${{ needs.merge-curate.outputs.baseline_rows }}"
          python3 -m polymarket_analytics outcome-gate \
            --features "$FEAT" \
            --min-events 100 \
            --train-end "${{ needs.preflight.outputs.train_end }}" \
            --baseline-rows "$BASELINE_ROWS" \
            | tee artifacts/gate/gate.json
          DECISION=$(python3 -c "import json; print(json.load(open('artifacts/gate/gate.json'))['decision'])")
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          if [ "$DECISION" = "BLOCKED" ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overnight-quality-gate
          path: artifacts/gate/
          retention-days: ${{ needs.preflight.outputs.retention }}

  outcome-sweep:
    name: Expanded outcome sweep
    needs: [preflight, quality-gate, merge-curate]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.merge-curate.result == 'success' &&
      needs.quality-gate.result == 'success' &&
      github.event.inputs.run_outcome_sweep == 'true' &&
      (needs.quality-gate.outputs.decision == 'PASS-DEFINITIVE' || needs.quality-gate.outputs.decision == 'PASS-BOUNDED')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: polymarket-canonical-expanded
          path: incoming
      - name: Run purged outcome sweep
        run: |
          set -euo pipefail
          mkdir -p data/research_expanded data
          tar -xzf incoming/polymarket-canonical-expanded.tar.gz -C data
          FEAT=data/canonical_expanded/trade_features_canonical_expanded.parquet
          test -f "$FEAT"
          python3 -m polymarket_analytics sweep-outcomes \
            --features "$FEAT" \
            --out-dir data/research_expanded \
            --train-end "${{ needs.preflight.outputs.train_end }}" \
            --seed 42 \
            2>&1 | tee data/research_expanded/sweep.log
      - name: Package sweep
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          src = Path("data/research_expanded")
          out = Path("dist/polymarket-outcome-sweep.tar.gz")
          with tarfile.open(out, "w:gz") as tar:
              if src.exists():
                  tar.add(src, arcname="research_expanded")
          h = hashlib.sha256(out.read_bytes()).hexdigest()
          Path("dist/polymarket-outcome-sweep.sha256").write_text(f"{h}  {out.name}\n")
          Path("dist/manifest.json").write_text(json.dumps({"archive": out.name, "sha256": h}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polymarket-outcome-sweep
          path: dist/
          retention-days: ${{ needs.preflight.outputs.retention }}

  final-summary:
    name: Final overnight summary
    needs: [preflight, backfill-2024, backfill-2025, backfill-2026, l2-collect, merge-curate, quality-gate, outcome-sweep]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        if: always()
        with:
          path: incoming
        continue-on-error: true
      - name: Write morning report
        env:
          BF24: ${{ needs.backfill-2024.result }}
          BF25: ${{ needs.backfill-2025.result }}
          BF26: ${{ needs.backfill-2026.result }}
          L2: ${{ needs.l2-collect.result }}
          MERGE: ${{ needs.merge-curate.result }}
          GATE: ${{ needs.quality-gate.result }}
          GATE_DECISION: ${{ needs.quality-gate.outputs.decision }}
          SWEEP: ${{ needs.outcome-sweep.result }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/report docs/research
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          jobs = {
            "backfill_2024": os.environ.get("BF24"),
            "backfill_2025": os.environ.get("BF25"),
            "backfill_2026": os.environ.get("BF26"),
            "l2_collect": os.environ.get("L2"),
            "merge_curate": os.environ.get("MERGE"),
            "quality_gate": os.environ.get("GATE"),
            "outcome_sweep": os.environ.get("SWEEP"),
          }
          gate_decision = os.environ.get("GATE_DECISION") or "n/a"
          research_authorized = all(
            jobs[k] == "success" for k in ("backfill_2024","backfill_2025","backfill_2026","merge_curate","quality_gate")
          ) and gate_decision in {"PASS-BOUNDED","PASS-DEFINITIVE"}
          # Collect year quality / coverage / l2 / sweep if present
          pieces = {"jobs": jobs, "gate_decision": gate_decision, "research_authorized": research_authorized}
          for path in Path("incoming").rglob("*.json"):
              try:
                  pieces[str(path.relative_to("incoming"))] = json.loads(path.read_text())
              except Exception as exc:
                  pieces[str(path)] = {"error": str(exc)}
          Path("artifacts/report/overnight_summary.json").write_text(json.dumps(pieces, indent=2, default=str))
          lines = [
            "# Overnight Polymarket Research Report",
            "",
            f"**Research authorized:** `{research_authorized}`",
            f"**Gate decision:** `{gate_decision}`",
            "",
            "## GitHub job status vs research validity",
            "",
            "GitHub job success is not sufficient. Research authorization requires successful backfills, merge with new features, and a non-BLOCKED gate.",
            "",
            "```json",
            json.dumps(jobs, indent=2),
            "```",
            "",
            "## Critical checks",
            "",
            f"- Empty years / failed backfills: inspect year_quality.json in artifacts",
            f"- Missing features / locked-test / baseline fallback: inspect gate.json and coverage_report.json",
            f"- L2 crashes: inspect l2_manifest.json health.ok",
            "",
          ]
          Path("artifacts/report/overnight_report.md").write_text("\n".join(lines))
          Path("docs/research/overnight_report.md").write_text("\n".join(lines))
          print(json.dumps({"research_authorized": research_authorized, "gate_decision": gate_decision, "jobs": jobs}, indent=2))
          if not research_authorized:
              raise SystemExit("research_authorized=false")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polymarket-overnight-report
          path: artifacts/report/
          retention-days: ${{ needs.preflight.outputs.retention }}
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Overnight research summary"
            echo ""
            if [ -f artifacts/report/overnight_report.md ]; then
              cat artifacts/report/overnight_report.md
            else
              echo "Report file missing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
